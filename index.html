<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SECOND BRAIN AI</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #f5c542;
    --text: #e9e9ec;
    --muted: #9a9ca3;
    --border: #2a2d36;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 20px 8px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.5px; }
  header p { color: var(--muted); margin: 6px 0 0; font-size: 0.9rem; }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
    font-weight: 600;
  }

  .panel {
    max-width: 700px;
    margin: 0 auto 60px;
    padding: 0 20px;
    display: none;
  }
  .panel.active { display: block; }

  textarea, input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.95rem;
    resize: vertical;
  }
  textarea:focus, input:focus { outline: 1px solid var(--accent); }

  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row select { flex: 1; }

  button.action {
    margin-top: 14px;
    background: var(--accent);
    color: #1a1a1a;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button.action:disabled { opacity: 0.6; cursor: not-allowed; }

  .output {
    margin-top: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    min-height: 60px;
  }
  .output img, .output video { max-width: 100%; border-radius: 10px; display: block; }

  .chat-log { display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
  .msg.user { background: var(--accent); color: #1a1a1a; align-self: flex-end; }
  .msg.ai { background: #23262f; align-self: flex-start; }

  .status { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>🧠 SECOND BRAIN AI</h1>
  <p>Chat · Image · Video — your personal AI companion</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="chat">💬 Chat</button>
  <button class="tab-btn" data-tab="image">🖼️ Image</button>
  <button class="tab-btn" data-tab="video">🎬 Video</button>
</div>

<!-- CHAT PANEL -->
<div class="panel active" id="chat">
  <div class="output chat-log" id="chatLog"></div>
  <textarea id="chatInput" rows="2" placeholder="Type your message..."></textarea>
  <button class="action" id="chatBtn">Send</button>
  <div class="status" id="chatStatus"></div>
</div>

<!-- IMAGE PANEL -->
<div class="panel" id="image">
  <textarea id="imagePrompt" rows="2" placeholder="Describe the image you want..."></textarea>
  <div class="row">
    <select id="imageModel">
      <option value="flux">Flux</option>
      <option value="zimage">Zimage</option>
    </select>
  </div>
  <button class="action" id="imageBtn">Generate Image</button>
  <div class="status" id="imageStatus"></div>
  <div class="output" id="imageOutput"></div>
</div>

<!-- VIDEO PANEL -->
<div class="panel" id="video">
  <textarea id="videoPrompt" rows="2" placeholder="Describe the video you want..."></textarea>
  <div class="row">
    <select id="videoModel">
      <option value="seedance">Seedance</option>
      <option value="wan-fast">Wan-Fast</option>
      <option value="veo">Veo (alpha)</option>
    </select>
  </div>
  <button class="action" id="videoBtn">Generate Video</button>
  <div class="status" id="videoStatus">Video generation can take a while — please be patient.</div>
  <div class="output" id="videoOutput"></div>
</div>

<script>
  // Tab switching
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  // ---------- CHAT ----------
  const chatLog = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  const chatBtn = document.getElementById("chatBtn");
  const chatStatus = document.getElementById("chatStatus");
  let history = [];

  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "ai");
    div.textContent = text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  chatBtn.addEventListener("click", async () => {
    const text = chatInput.value.trim();
    if (!text) return;
    addMsg("user", text);
    history.push({ role: "user", content: text });
    chatInput.value = "";
    chatBtn.disabled = true;
    chatStatus.textContent = "Thinking...";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || "No response";
      addMsg("ai", reply);
      history.push({ role: "assistant", content: reply });
      chatStatus.textContent = "";
    } catch (err) {
      chatStatus.textContent = "Error: " + err.message;
    } finally {
      chatBtn.disabled = false;
    }
  });

  // ---------- IMAGE ----------
  document.getElementById("imageBtn").addEventListener("click", async () => {
    const prompt = document.getElementById("imagePrompt").value.trim();
    const model = document.getElementById("imageModel").value;
    const status = document.getElementById("imageStatus");
    const output = document.getElementById("imageOutput");
    if (!prompt) return;

    status.textContent = "Generating image...";
    output.innerHTML = "";

    try {
      const res = await fetch("/api/image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, model }),
      });
      if (!res.ok) throw new Error("Generation failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      output.innerHTML = `<img src="${url}" alt="${prompt}" />`;
      status.textContent = "Done.";
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
  });

  // ---------- VIDEO ----------
  document.getElementById("videoBtn").addEventListener("click", async () => {
    const prompt = document.getElementById("videoPrompt").value.trim();
    const model = document.getElementById("videoModel").value;
    const status = document.getElementById("videoStatus");
    const output = document.getElementById("videoOutput");
    if (!prompt) return;

    status.textContent = "Generating video... this can take a minute or two.";
    output.innerHTML = "";

    try {
      const res = await fetch("/api/video", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, model }),
      });
      if (!res.ok) throw new Error("Generation failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      output.innerHTML = `<video src="${url}" controls autoplay loop></video>`;
      status.textContent = "Done.";
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
  });
</script>

</body>
</html>
